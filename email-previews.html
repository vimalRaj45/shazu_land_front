    let currentTemplateId = 'event-reg-paid-pending';
    let currentViewMode = 'desktop';

    // ==========================================
    // INITIALIZATION & EVENT HANDLERS
    // ==========================================
    function init() {
      renderMenu();
      selectTemplate(currentTemplateId);
    }

    function renderMenu() {
      const menu = document.getElementById('template-menu');
      menu.innerHTML = templates.map(t => {
        const isActive = t.id === currentTemplateId;
        return `
          <button onclick="selectTemplate('${t.id}')" class="w-full text-left p-2.5 rounded-xl transition-all flex items-start gap-2.5 cursor-pointer ${
            isActive 
              ? 'bg-brand-green text-white shadow-md border border-emerald-500/40' 
              : 'hover:bg-slate-900 text-slate-300 border border-transparent'
          }">
            <div class="p-1.5 rounded-lg bg-slate-900/60 text-emerald-400 shrink-0 text-sm mt-0.5">
              <i class="bi ${t.icon}"></i>
            </div>
            <div class="min-w-0 flex-1">
              <div class="font-bold text-xs truncate ${isActive ? 'text-white' : 'text-slate-200'}">${t.name}</div>
              <div class="text-[10px] text-slate-400 truncate mt-0.5">${t.description}</div>
            </div>
          </button>
        `;
      }).join('');
    }

    function selectTemplate(id) {
      currentTemplateId = id;
      renderMenu();

      const t = templates.find(x => x.id === id);
      if (!t) return;

      const { subject, htmlContent } = t.render();
      document.getElementById('preview-subject').textContent = subject;
      document.getElementById('preview-template-category').textContent = `Category: ${t.category}`;
      document.getElementById('preview-content').innerHTML = htmlContent;
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      const box = document.getElementById('preview-viewport-box');
      const deskBtn = document.getElementById('view-desktop-btn');
      const mobBtn = document.getElementById('view-mobile-btn');

      if (mode === 'mobile') {
        box.classList.remove('max-w-[620px]');
        box.classList.add('max-w-[375px]');
        mobBtn.classList.add('bg-brand-green', 'text-white');
        mobBtn.classList.remove('text-slate-400');
        deskBtn.classList.remove('bg-brand-green', 'text-white');
        deskBtn.classList.add('text-slate-400');
      } else {
        box.classList.remove('max-w-[375px]');
        box.classList.add('max-w-[620px]');
        deskBtn.classList.add('bg-brand-green', 'text-white');
        deskBtn.classList.remove('text-slate-400');
        mobBtn.classList.remove('bg-brand-green', 'text-white');
        mobBtn.classList.add('text-slate-400');
      }
    }

    function copySubject() {
      const subject = document.getElementById('preview-subject').textContent;
      navigator.clipboard.writeText(subject);
      alert('Subject line copied to clipboard!');
    }

    function copyHtmlSource() {
      const content = document.getElementById('preview-content').innerHTML;
      navigator.clipboard.writeText(content);
      alert('Email HTML source code copied to clipboard!');
    }

    function printEmailFrame() {
      window.print();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
